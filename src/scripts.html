<script>
(() => {
  const french = document.documentElement.lang === 'fr';
  const readSetting = key => {
    try { return localStorage.getItem(key); } catch { return null; }
  };
  const saveSetting = (key, value) => {
    try { localStorage.setItem(key, value); } catch { /* Storage is optional. */ }
  };

  const theme = document.getElementById('darkmode');
  if (theme) {
    theme.checked = readSetting('darkmode') === 'true';
    theme.addEventListener('change', () => saveSetting('darkmode', theme.checked));
  }

  const order = document.querySelector('.order-toggle');
  if (order) {
    const setOrder = ordered => {
      document.body.classList.toggle('ordered', ordered);
      order.setAttribute('aria-pressed', String(ordered));
      order.querySelector('.order-label').textContent = ordered
        ? (french ? 'Remettre le désordre' : 'Bring back the mess')
        : (french ? 'Un peu d’ordre ?' : 'Make sense of this?');
    };
    setOrder(readSetting('catalog-order') === 'true');
    order.hidden = false;
    order.addEventListener('click', () => {
      const ordered = !document.body.classList.contains('ordered');
      setOrder(ordered);
      saveSetting('catalog-order', ordered);
    });
  }

  const page = location.pathname.split('/').pop() || 'index.html';
  document.querySelectorAll('[data-language]').forEach(link => {
    const base = page.replace(/(_fr)?\.html$/, '');
    link.href = base + (link.dataset.language === 'fr' ? '_fr' : '') + '.html';
  });
  document.querySelectorAll('#menu a, .category-strip a').forEach(link => {
    if (link.getAttribute('href') === page) link.setAttribute('aria-current', 'page');
  });

  const index = document.querySelector('.site-index');
  if (index) {
    document.addEventListener('click', event => {
      if (!index.contains(event.target)) index.open = false;
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && index.open) {
        index.open = false;
        index.querySelector('summary').focus();
      }
    });
  }

  const dialog = document.querySelector('.image-dialog');
  if (dialog) {
    let activeTarget;
    const image = dialog.querySelector('img');
    document.querySelectorAll('.zoom-target').forEach(target => {
      target.addEventListener('click', () => {
        const source = target.querySelector('img');
        image.src = source.src;
        image.alt = source.alt;
        activeTarget = target;
        target.setAttribute('aria-expanded', 'true');
        dialog.showModal();
        document.documentElement.style.overflow = 'hidden';
      });
    });
    dialog.querySelector('.zoom-close').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', event => {
      if (event.target === dialog) {
        const rect = dialog.getBoundingClientRect();
        if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();
      }
    });
    dialog.addEventListener('close', () => {
      document.documentElement.style.overflow = '';
      activeTarget.setAttribute('aria-expanded', 'false');
      activeTarget.focus({ preventScroll: true });
    });
  }
})();
</script>
